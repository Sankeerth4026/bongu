name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    

    steps:
      - name : checkout code
        uses : actions/checkoutcode@v6
      - name : SSH and Deploy
        uses : appleboy/ssh-action@v1
        with :
          host : ${{ secrets.SSH_HOST}}
          username : ubuntu
          key : ${{ secrets.EC2_SSH_KEY}}
          script: |
            # These are the commands that run ON YOUR SERVER
            cd /bongu
            git pull 
            sudo docker compose down
            sudo docker compose up -d --build